name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No write access: this workflow reads the code and reports, it never modifies
# the repository. A read-only token cannot be turned into a push, even if a
# link in the toolchain were compromised.
permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The bot runs on a single version in its container, but testing three
        # catches syntax newer than the declared floor, which a local
        # development interpreter alone would never reveal.
        python-version: ['3.10', '3.11', '3.12']

    steps:
      # Actions are pinned to a commit SHA, never to a tag: a git tag can be
      # moved, so it records the version we *wanted* rather than the code that
      # actually runs. The version stays in a comment so the pin is readable.
      # Same rule as butin-bdo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        run: pytest
